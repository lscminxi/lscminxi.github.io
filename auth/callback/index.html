<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正在登录 · Minxi 的 blog</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b0e14; color:#e6eaf0; font:15px/1.8 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    main { max-width:420px; padding:28px; text-align:center; }
    a { color:#5ce0c4; }
    .muted { color:#919ba9; font-size:13px; }
  </style>
  <!-- OAuth 回调处理在 auth.js 里：校验 state → 经小后端换令牌 → 向 GitHub 确认身份 → 跳回原页面 -->
  <script src="/js/auth.js?v=auth-1" defer></script>
</head>
<body>
  <main>
    <h1>正在通过 GitHub 登录…</h1>
    <p id="oauth-status" role="status">正在验证授权，请稍候。</p>
    <p class="muted">如果长时间没有反应，可以 <a href="/">返回首页</a> 后重新点「登录」。</p>
  </main>
</body>
</html>
