name: Build and deploy blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 不取消进行中的运行：在线后台连续保存时，构建任务需要按顺序完成并提交静态文件。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_mode: ${{ steps.pages.outputs.mode }}
    defaults:
      run:
        working-directory: blog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:admin-auth
      - run: npm run test:auth
      - name: Detect existing Pages publishing mode
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" != "workflow" ]; then
            echo "::notice::Pages publishes committed root files. The built-in Pages workflow handles this deployment."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: blog/public

  # 在线后台（/admin/）通过 GitHub API 提交 Markdown 后，这里自动构建并把生成的
  # 静态文件提交回 main，GitHub Pages 内置工作流随后发布，无需手动运行 publish:prepare。
  publish-root:
    name: Publish generated static files
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.pages_mode != 'workflow'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      # 完整历史：在线后台可能在构建期间提交新内容，需要能 rebase 后再推送。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - name: Install dependencies
        working-directory: blog
        run: npm ci
      - name: Build and publish the latest source revision
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 后台短时间内连续保存/删除时，较早的工作流可能晚于较新的提交开始执行。
          # 始终从远端 main 的最新源码重新生成；若构建期间 main 又变化，则丢弃旧产物、
          # 基于最新源码重建后重试。这样不会因生成文件 rebase 冲突而留下“源码已删除、
          # 首页仍是旧版本”的状态。
          for attempt in 1 2 3 4; do
            echo "Publish attempt $attempt from latest origin/$GITHUB_REF_NAME"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            npm --prefix blog run publish:prepare
            git add -A

            if git diff --cached --quiet; then
              echo "No generated changes to publish."
              exit 0
            fi

            source_sha=$(git rev-parse --short HEAD)
            git commit -m "chore: publish generated site for ${source_sha} [skip ci]"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi

            echo "main changed while building; rebuilding the latest revision."
          done

          echo "Failed to publish after 4 attempts." >&2
          exit 1

      # GITHUB_TOKEN commits do not automatically trigger another Pages workflow.
      # Explicitly request a branch-based Pages build of the freshly exported root.
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.pages_mode == 'workflow'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
