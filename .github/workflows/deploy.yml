name: Build and deploy blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_mode: ${{ steps.pages.outputs.mode }}
    defaults:
      run:
        working-directory: blog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Detect existing Pages publishing mode
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" != "workflow" ]; then
            echo "::notice::Pages publishes committed root files. The built-in Pages workflow handles this deployment."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: blog/public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.pages_mode == 'workflow'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
