# 导航与个人资料
nickname: lsc_minxi
github: https://github.com/lscminxi

# 评论与点赞
# provider: local  = 评论/点赞保存在访客自己的浏览器（localStorage），零配置即可用（默认）
# provider: giscus = 使用 GitHub Discussions 全站共享评论与反应（点赞），访客在 Giscus 里用 GitHub 登录。
#                    启用前需按 README「评论与点赞」一节在仓库开启 Discussions、安装 giscus app，
#                    再到 https://giscus.app 取得下面三项 ID 填进来；没填全时会自动回落到 local。
comments:
  provider: local
  giscus:
    repo: lscminxi/lscminxi.github.io
    repo_id: ""
    category: Announcements
    category_id: ""

# 访客登录
# 唯一的访客登录方式：GitHub OAuth。provider 须为 oauth，且 client_id 与 worker_url
# 都填好（见 oauth-worker/README.md）；没填全时登录弹窗只提示暂不可用，
# 不提供任何绕过 GitHub 授权的备用登录。client_secret 绝不要填到这里。
auth:
  provider: oauth
  oauth:
    client_id: "Ov23liRQRP65PNxJ7N6V"
    worker_url: "https://minxi-github-auth.lsc-minxi.workers.dev"
    scope: "read:user"
