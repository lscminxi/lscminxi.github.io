title: Minxi 的 blog
subtitle: 幼儿园小班水平
description: 一个糖糖的 blog
author: lsc_minxi
language: zh-CN
timezone: Asia/Shanghai
url: https://lscminxi.github.io
root: /
permalink: :year/:month/:day/:title/
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - admin/**
  - vendor/**
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false
prismjs:
  enable: false
index_generator:
  path: ''
  per_page: 6
  order_by: -date
default_category: 未分类
tag_map:
  "C++": cpp
per_page: 10
pagination_dir: page
theme: minxi
